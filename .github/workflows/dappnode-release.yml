name: DAppNode Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

defaults:
  run:
    working-directory: deployment

jobs:
  release:
    name: Build DAppNode Package & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install dappnodesdk
        run: npm install -g @dappnode/sdk

      - name: Build DAppNode package
        run: dappnodesdk build || true

      - name: Verify artifact
        id: artifact
        run: |
          FILE=$(ls build_word-circles.public.dappnode.eth_${{ inputs.version }}/*.txz 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "Build artifact not found — dappnodesdk build failed." && exit 1
          fi
          echo "FILE=$FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dappnode-v${{ inputs.version }}
          name: DAppNode v${{ inputs.version }}
          generate_release_notes: true
          files: deployment/${{ steps.artifact.outputs.FILE }}
